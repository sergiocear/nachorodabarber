<svg width="500" height="160" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Nacho Roda Barber Logo</title>
  <rect width="680" height="200" fill="#000"/>
  <defs>
    <clipPath id="poleBody">
      <rect x="52" y="38" width="30" height="110" rx="2"/>
    </clipPath>
  </defs>
  <!-- BASE -->
  <rect x="44" y="150" width="46" height="7" rx="2" fill="white"/>
  <rect x="48" y="145" width="38" height="7" rx="2" fill="white"/>
  <!-- POLE white bg -->
  <rect x="52" y="38" width="30" height="110" rx="2" fill="white"/>
  <!-- BLACK STRIPES -->
  <g clip-path="url(#poleBody)">
    <line x1="20" y1="10"  x2="95" y2="85"  stroke="black" stroke-width="10"/>
    <line x1="20" y1="34"  x2="95" y2="109" stroke="black" stroke-width="10"/>
    <line x1="20" y1="58"  x2="95" y2="133" stroke="black" stroke-width="10"/>
    <line x1="20" y1="82"  x2="95" y2="157" stroke="black" stroke-width="10"/>
    <line x1="20" y1="106" x2="95" y2="181" stroke="black" stroke-width="10"/>
    <line x1="20" y1="130" x2="95" y2="205" stroke="black" stroke-width="10"/>
  </g>
  <rect x="52" y="38" width="30" height="110" rx="2" fill="none" stroke="#aaa" stroke-width="0.5"/>
  <!-- SPHERE TOP -->
  <circle cx="67" cy="14" r="5" fill="white"/>
  <rect x="63" y="22" width="8" height="18" fill="white"/>
  <ellipse cx="67" cy="24" rx="10" ry="10" fill="white"/>
  <ellipse cx="67" cy="28" rx="15" ry="8" fill="white"/>
  <!-- COLLARS -->
  <rect x="50" y="36" width="34" height="5" rx="1" fill="white"/>
  <rect x="50" y="143" width="34" height="5" rx="1" fill="white"/>
  <!-- TEXT -->
  <text x="115" y="102" font-family="'Times New Roman', Georgia, serif" font-size="56" font-weight="700" letter-spacing="5" fill="white">NACHO RODA</text>
  <text x="120" y="128" font-family="'Times New Roman', Georgia, serif" font-size="20" font-weight="400" letter-spacing="12" fill="white">BARBER</text>
</svg>
